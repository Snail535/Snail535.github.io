# ============================================================
# 刊物注册表 —— 本站所有杂志的唯一数据源
# ============================================================
# 新增刊物的三种方式（任选其一）：
#   1) 在下面 magazines: 里加一条（推荐，可自定义分类/简介/主题色）
#   2) 直接把 PDF 目录丢进 E:\迅雷下载\英文杂志\原文档\<新目录>，
#      脚本会自动登记为「其他」分类，并提示你来这里补分类
#   3) 个别期次手工创建 md（见底部“手动补一期”说明），不影响批量生成
#
# 字段说明：
#   slug       URL 用的英文标识，同时是 content/magazines/<slug>/ 目录名
#   name       显示名称（卡片和标题上用的）
#   category   分类，决定 /categories/ 下的归属，同名自动聚合
#   folders    对应的 PDF 目录名（可多个，用于同一刊物的不同来源目录）
#   cadence    weekly / monthly / bimonthly / quarterly，仅作展示
#   color      卡片顶部标签的主题色
#   adult      需要默认遮罩的标记，true 时封面默认打码，点击/悬停才显示
#   desc       一句话简介，显示在刊物页顶部
# ============================================================

defaults:
  category: "其他"
  language: "English"
  adult: false
  cadence: "monthly"

# ------------------------------------------------------------
