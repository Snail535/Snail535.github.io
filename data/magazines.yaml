# ============================================================
# 手动补一期（不依赖 PDF 批量生成）
# ============================================================
# 在 content/magazines/<slug>/ 下手写一个 md，建议命名为 <YYYY-MM-DD>-<edition>.md：
#
#   ---
#   title: "2026 年 11 月刊"
#   date: 2026-11-01
#   draft: false
#   magazine: "Playboy"
#   magazine_slug: "playboy"
#   edition: ""
#   issue: "2026-11"
#   pages: 120
#   adult: true
#   cover:
#     image: "/thumbs/magazines/playboy/2026-11/cover.webp"
#     thumb: "/thumbs/magazines/playboy/2026-11/thumb.webp"
#     alt: "Playboy 2026 年 11 月刊"
#   preview1: "/thumbs/magazines/playboy/2026-11/p1.webp"
#   preview2: "/thumbs/magazines/playboy/2026-11/p2.webp"
#   preview3: "/thumbs/magazines/playboy/2026-11/p3.webp"
#   preview4: "/thumbs/magazines/playboy/2026-11/p4.webp"
#   download_url: ""
#   download_pwd: ""
#   ---
#
#   正文随便写简介；图片按上面路径自己放好即可。
