name = "magazine-links"
main = "index.js"
compatibility_date = "2026-11-01"
account_id = "f5309cc14e54f70864c5b1405751ddb8"

# 每天允许打开网盘入口的次数
[vars]
DAILY_LIMIT = "5"
# 允许调用的站点来源，逗号分隔
ALLOWED_ORIGINS = "https://snail535.github.io,https://www.snail535.github.io"
# 站长白名单 IP（逗号分隔，可留空）。家里宽带 IP 变了就在这里改，或者干脆用 ADMIN_KEY 方式
BYPASS_IPS = ""

# 站长白名单密钥用 `wrangler secret put ADMIN_KEY` 写入，不写在这里（会进仓库）

# 链接数据与计数器都存这里；id 由 `wrangler kv namespace create LINKS` 生成
[[kv_namespaces]]
binding = "LINKS"
id = "26591befb8e2488f8fb68a19cf8a4239"

# 热度统计（第几次被打开）存 D1；id 由 `wrangler d1 create magazine_stats` 生成，
# 填好之后执行 `wrangler d1 execute magazine_stats --remote --file=schema.sql`
[[d1_databases]]
binding = "DB"
database_name = "magazine_stats"
database_id = "TO_BE_FILLED"

# 自定义域名：workers.dev 在国内直连不通，必须走自己的域名
[[routes]]
pattern = "dl.xinyesucai.top"
custom_domain = true
