name = "magazine-links"
main = "index.js"
compatibility_date = "2026-11-01"

# 每天允许打开网盘入口的次数
[vars]
DAILY_LIMIT = "5"
# 允许调用的站点来源，逗号分隔
ALLOWED_ORIGINS = "https://snail535.github.io,https://www.snail535.github.io"

# 链接数据与计数器都存这里；id 由 `wrangler kv namespace create LINKS` 生成
[[kv_namespaces]]
binding = "LINKS"
id = "PUT_KV_NAMESPACE_ID_HERE"

# 域名批下来后取消下面两行注释，把自定义域名挂到 Worker 上
# （workers.dev 在国内直连不通，必须走自己的域名）
# [[routes]]
# pattern = "dl.example.com"
# custom_domain = true
