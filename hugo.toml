baseURL = "https://snail535.github.io/"
locale = "zh-CN"
title = "新叶素材"
theme = "PaperMod"
buildFuture = true
buildExpired = true
# 让 PaperMod 的 robots.txt 模板生效（里面会自动带上 Sitemap 地址）
enableRobotsTXT = true

[params]
  env = "production"
  description = "免费分享的英文原版杂志库：经济学人、纽约客、福布斯、科学、时代周刊等，按期更新，提供封面与内页预览、在线试读和网盘下载。"
  ShowReadingTime = false
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = false
  displayCopyrightInFooter = false
  search = true
  mainSections = ["magazines"]
  # 下载入口配额：留空 = 浏览器本地计数（挡不住爬虫）；
  # 填 Worker 地址 = 服务端按 IP 计数，超限不返回链接
  linkApi = "https://dl.xinyesucai.top"
  linkDailyLimit = 5
  # 网盘里是图种（.jpg 改 .7z），这里是全站统一的解压密码；
  # 某一期密码不同时，在该期 md 的 front matter 写 archive_pwd: "xxx" 覆盖
  archivePwd = "xinyesucai"

[menu]
[[menu.main]]
name = "首页"
url = "/"
weight = 1

[[menu.main]]
name = "杂志库"
url = "/magazines/"
weight = 2

[[menu.main]]
name = "热榜"
url = "/hot/"
weight = 3

[[menu.main]]
name = "分类"
url = "/categories/"
weight = 4

[[menu.main]]
name = "关于"
url = "/about/"
weight = 5

[[menu.main]]
name = "搜索"
url = "/search/"
weight = 9

[taxonomies]
  category = "categories"
  edition = "editions"
  year = "years"

[pagination]
pagerSize = 30
path = 'page'

# ========== 搜索功能配置 ==========
[outputs]
home = ["HTML", "RSS", "JSON", "magindex"]

# 热榜用的小索引：/magindex.json，只含「键 → 标题/链接/缩略图」，
# 比 index.json（含全文）小一个数量级，前端拉热榜时按需加载
[outputFormats.magindex]
mediaType = "application/json"
baseName = "magindex"
isPlainText = true
notAlternative = true

[params.fuseOpts]
isCaseSensitive = false
shouldSort = true
location = 0
distance = 1000
threshold = 0.4
minMatchCharLength = 1
keys = ["title", "summary", "content", "magazine"]

# ========== 搜索引擎收录 ==========
[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

# 站长平台验证：拿到验证码后，去掉下面的注释、把引号里换成验证码即可。
# 会由 layouts/partials/extend_head.html 输出成首页 <meta> 标签，
# 比往 static/ 放验证文件省事，也不需要改模板。
# [params.verification]
#   google = "Google Search Console 的验证码"
#   baidu = "百度搜索资源平台的验证码"
#   bing  = "Bing Webmaster 的验证码"
