baseURL = "https://Snail535.github.io/"
locale = "zh-CN"
title = "新叶素材"
theme = "PaperMod"
buildFuture = true
buildExpired = true

[params]
  env = "production"
  description = "免费分享的英文原版杂志库"
  ShowReadingTime = false
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = false
  displayCopyrightInFooter = false
  search = true
  mainSections = ["magazines"]
  # 下载入口配额：留空 = 浏览器本地计数（挡不住爬虫）；
  # 填 Worker 地址 = 服务端按 IP 计数，超限不返回链接
  linkApi = "https://dl.xinyesucai.top"
  linkDailyLimit = 5
  # 网盘里是图种（.jpg 改 .7z），这里是全站统一的解压密码；
  # 某一期密码不同时，在该期 md 的 front matter 写 archive_pwd: "xxx" 覆盖
  archivePwd = "xinyesucai"

[menu]
[[menu.main]]
name = "首页"
url = "/"
weight = 1

[[menu.main]]
name = "杂志库"
url = "/magazines/"
weight = 2

[[menu.main]]
name = "热榜"
url = "/hot/"
weight = 3

[[menu.main]]
name = "分类"
url = "/categories/"
weight = 4

[[menu.main]]
name = "关于"
url = "/about/"
weight = 5

[[menu.main]]
name = "搜索"
url = "/search/"
weight = 9

[taxonomies]
  category = "categories"
  edition = "editions"
  year = "years"

[pagination]
pagerSize = 30
path = 'page'

# ========== 搜索功能配置 ==========
[outputs]
home = ["HTML", "RSS", "JSON", "magindex"]

# 热榜用的小索引：/magindex.json，只含「键 → 标题/链接/缩略图」，
# 比 index.json（含全文）小一个数量级，前端拉热榜时按需加载
[outputFormats.magindex]
mediaType = "application/json"
baseName = "magindex"
isPlainText = true
notAlternative = true

[params.fuseOpts]
isCaseSensitive = false
shouldSort = true
location = 0
distance = 1000
threshold = 0.4
minMatchCharLength = 1
keys = ["title", "summary", "content", "magazine"]
