{{ define "main" }}
<h1 style="margin-bottom:1rem;">{{ .Title }}</h1>
<div class="custom-card-grid">
{{ $pages := .Pages }}
{{ range $pages }}
<div class="card-item">
  {{ with .Params.cover.image }}
  <div class="card-image">
    <img src="{{ . }}" alt="{{ $.Params.cover.alt }}">
  </div>
  {{ end }}
  <div class="card-body">
    <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
  </div>
</div>
{{ end }}
</div>
{{ end }}
