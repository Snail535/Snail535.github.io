name: Build and Deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu‑latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Hugo
        uses: peaceiris/actions‑hugo‑setup@v4
        with:
          hugo‑version: latest

      - name: Build Hugo
        run: hugo --minify

      - name: Upload artifact
        uses: actions/upload‑pages‑artifact@v4

  deploy:
    environment:
      name: github‑pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs‑on: ubuntu‑latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy‑pages@v4
